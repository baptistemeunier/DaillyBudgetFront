<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>dailyBudget</title>
  <!-- Fond plein cadre : iOS et Android appliquent leur propre masque d'arrondi -->
  <rect width="1024" height="1024" fill="#4f46e5"/>
  <!-- Piste de la jauge (partie restante du budget) -->
  <circle cx="512" cy="512" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="120"/>
  <!-- Jauge : 3/4 du budget du jour -->
  <path d="M512 252 A260 260 0 1 1 252 512" fill="none" stroke="#ffffff" stroke-width="120" stroke-linecap="round"/>
  <!-- Le jour : point central -->
  <circle cx="512" cy="512" r="72" fill="#34d399"/>
</svg>
